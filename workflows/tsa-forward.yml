name: tsa-forward
on:
  schedule:
    - cron: "0 8 * * *"      # 08:00 UTC daily ≈ 23h before these markets close
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab
permissions:
  contents: write              # allows it to commit results back to the repo
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run collector
        run: node forward/collector.js
      - name: Commit results
        run: |
          git config user.name "tsa-bot"
          git config user.email "tsa-bot@users.noreply.github.com"
          git add forward/state.json forward/results.csv
          git commit -m "forward collect $(date -u +%F)" || echo "no changes to commit"
          git push || echo "nothing to push"
